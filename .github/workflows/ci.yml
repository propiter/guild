# CI del propio gremio — corre EXACTAMENTE lo mismo que scripts/verify.sh, en el
# mismo orden. La paridad la fuerza scripts/check-ci-parity.sh, que corre COMO
# PARTE de verify.sh: si este workflow alguna vez reimplementa la lista de checks
# en vez de invocar verify.sh, el propio verify.sh (local Y acá) se pone en rojo.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (los guardrails del gremio, sobre el gremio)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pyyaml (para el YAML estricto de check-frontmatter/check-version)
        run: pip install pyyaml || pip3 install pyyaml || python3 -m pip install pyyaml

      - name: verify
        run: bash scripts/verify.sh
